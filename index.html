[9,'Filet de porc à la moutarde, riz et brocolis','midi',25,['Filet de porc|300|g','Riz|100|g','Brocolis|300|g','Crème légère|50|ml','Moutarde|10|g'],'Cuire riz et brocolis. Dorer le porc puis ajouter crème et moutarde et terminer la cuisson.'],
[10,'Quiche sans pâte au jambon','soir',35,['Œufs|3|unité','Jambon blanc|2|tranche','Lait|150|ml','Fromage râpé|40|g','Salade verte|0.5|pièce'],'Battre les œufs avec le lait, ajouter jambon et fromage. Cuire au four 25 min à 180 °C. Servir avec salade.'],

[12,'Velouté de poireaux et tartines','soir',30,['Poireaux|2|unité','Pommes de terre|150|g','Fromage frais|50|g','Pain complet|2|tranche'],'Cuire poireaux et pommes de terre dans l’eau 25 min et mixer. Servir avec le pain tartiné de fromage.'],
[13,'Rôti de dinde et légumes au four','midi',55,['Rôti de dinde|400|g','Pommes de terre|350|g','Carottes|300|g','Oignons|1|unité'],'Mettre la dinde et les légumes dans un plat avec un fond d’eau. Cuire à 180 °C environ 45 à 55 min selon la pièce jusqu’à cuisson à cœur.'],

[16,'Salade de poulet et avocat','soir',15,['Poulet|250|g','Avocat|1|unité','Tomates|2|unité','Salade verte|1|pièce'],'Cuire le poulet à cœur, laisser tiédir puis mêler aux légumes coupés.'],
[17,'Émincé de dinde, semoule et carottes','midi',25,['Escalopes de dinde|300|g','Semoule complète|120|g','Carottes|300|g'],'Cuire les carottes en rondelles. Faire revenir la dinde et préparer la semoule à l’eau chaude.'],

[19,'Cabillaud, patate douce et haricots','midi',30,['Cabillaud|300|g','Patates douces|350|g','Haricots verts|300|g'],'Cuire le poisson au four à 180 °C 15 à 20 min. Rôtir la patate douce coupée et cuire les haricots.'],
[20,'Œufs cocotte et épinards','soir',20,['Œufs|4|unité','Épinards|300|g','Crème légère|40|ml'],'Faire tomber les épinards. Répartir en ramequins avec crème et œufs. Cuire au bain-marie au four jusqu’à blanc pris.'],

[22,'Salade de pois chiches et concombre','soir',15,['Pois chiches cuits|300|g','Concombre|1|pièce','Tomates|2|unité','Fromage feta|60|g'],'Rincer les pois chiches. Mélanger avec tomates, concombre et feta émiettée.'],

[26,'Salade de lentilles et thon','soir',20,['Lentilles cuites|300|g','Thon au naturel|140|g','Tomates|2|unité'],'Mélanger les lentilles égouttées, le thon et les tomates avec une vinaigrette légère.'],

,[29, "Spaghettis carbonara", "midi", 35, ["Spaghettis|160|g", "Lardons|100|g", "Œufs|2|unité", "Parmesan|35|g"], "Cuire les pâtes. Dorer les lardons. Hors du feu, mélanger les œufs et le parmesan aux pâtes chaudes, puis ajouter les lardons et un peu d’eau de cuisson."],[30, "Steak-frites et salade", "midi", 35, ["Steak haché|250|g", "Pommes de terre|400|g", "Salade verte|0.5|pièce"], "Couper les pommes de terre en frites. Cuire à l’Air Fryer avec une petite quantité d’huile à 190 °C pendant 20 à 25 min. Saisir les steaks et servir avec la salade."],[31, "Hachis parmentier", "midi", 35, ["Viande hachée|250|g", "Pommes de terre|500|g", "Lait|80|ml", "Oignons|1|unité"], "Cuire puis écraser les pommes de terre avec le lait. Faire revenir le bœuf et l’oignon. Monter en couches et gratiner 15 min à 200 °C."],[32, "Croque-monsieur et salade", "soir", 25, ["Pain de mie complet|4|tranche", "Jambon blanc|2|tranche", "Emmental|60|g", "Salade verte|0.5|pièce"], "Garnir le pain de jambon et d’emmental. Faire dorer au four ou à l’appareil à croque-monsieur. Servir avec la salade."],[33, "Gratin dauphinois et jambon", "midi", 35, ["Pommes de terre|500|g", "Crème légère|150|ml", "Lait|100|ml", "Jambon blanc|2|tranche"], "Émincer finement les pommes de terre, couvrir de crème et lait, assaisonner et cuire à 180 °C environ 50 min. Servir avec le jambon."],[34, "Quiche lorraine et salade", "midi", 35, ["Pâte brisée|1|pièce", "Œufs|3|unité", "Lardons|120|g", "Crème légère|150|ml", "Salade verte|0.5|pièce"], "Répartir les lardons sur la pâte, verser les œufs battus avec la crème. Cuire à 180 °C environ 35 min. Servir avec salade."],[35, "Poulet rôti et pommes de terre", "midi", 35, ["Cuisses de poulet|2|unité", "Pommes de terre|450|g", "Carottes|250|g"], "Disposer le tout au four à 190 °C avec herbes et un peu d’huile. Cuire 40 à 50 min jusqu’à ce que le poulet soit cuit à cœur."],[36, "Pizza maison jambon champignons", "midi", 35, ["Pâte à pizza|1|pièce", "Sauce tomate|120|g", "Jambon blanc|2|tranche", "Champignons|150|g", "Mozzarella|100|g"], "Garnir la pâte avec sauce, jambon, champignons et mozzarella. Cuire à 220 °C environ 12 à 16 min."],[37, "Pâtes jambon crème", "midi", 35, ["Pâtes complètes|160|g", "Jambon blanc|2|tranche", "Crème légère|100|ml", "Petits pois|150|g"], "Cuire les pâtes et les petits pois. Réchauffer le jambon émincé avec la crème et mélanger."],[38, "Lasagnes bolognaises faciles", "midi", 35, ["Feuilles de lasagnes|120|g", "Viande hachée|250|g", "Pulpe de tomates|400|g", "Béchamel|250|ml", "Fromage râpé|50|g"], "Faire revenir la viande et la tomate. Alterner feuilles, viande et béchamel, parsemer de fromage. Cuire 35 min à 180 °C."],[39, "Saucisses lentilles", "midi", 35, ["Saucisses de volaille|2|unité", "Lentilles vertes|160|g", "Carottes|200|g", "Oignons|1|unité"], "Faire cuire lentilles, carottes et oignon dans l’eau 25 min environ. Cuire les saucisses à part, puis réunir."],[40, "Cordon-bleu et haricots verts", "midi", 35, ["Cordons-bleus|2|unité", "Haricots verts|350|g", "Pommes de terre|250|g"], "Cuire les cordons-bleus selon l’emballage jusqu’à cœur bien chaud. Cuire haricots et pommes de terre à la vapeur."],[41, "Boulettes de bœuf sauce tomate", "midi", 35, ["Boulettes de bœuf|300|g", "Pulpe de tomates|300|g", "Riz|130|g", "Oignons|1|unité"], "Faire revenir les boulettes avec l’oignon, ajouter la sauce tomate et laisser mijoter. Servir avec le riz cuit."],[42, "Riz cantonais simplifié", "midi", 35, ["Riz|150|g", "Œufs|2|unité", "Petits pois|150|g", "Jambon blanc|2|tranche"], "Cuire et refroidir le riz. Faire sauter avec petits pois et dés de jambon puis ajouter les œufs brouillés."],[43, "Escalope panée et purée", "midi", 35, ["Escalopes de dinde|300|g", "Chapelure|60|g", "Œufs|1|unité", "Pommes de terre|450|g", "Lait|80|ml"], "Paner les escalopes dans l’œuf et la chapelure, cuire à la poêle. Écraser les pommes de terre cuites avec le lait."],[44, "Chili con carne doux", "midi", 35, ["Viande hachée|250|g", "Hari function renew(){if(!confirm('Créer une nouvelle semaine ? Le menu actuel sera conservé dans l’historique, mais les coches des courses seront remises à zéro.'))return;state.history.unshift({week:state.week,slots:[...state.slots],date:new Date().toLocaleDateString('fr-FR')});state.history=state.history.slice(0,12);let previous=state.slots;let result=[];for(let type of ['midi','soir']){let pool=R.filter(r=>!state.deleted.includes(r[0])&&r[2]===type&& !previous.includes(r[0]));if(pool.length<7)pool=R.filter(r=>!state.deleted.includes(r[0])&&r[2]===type);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}result.push(pool.slice(0,7).map(r=>r[0]))}state.slots=days.flatMap((_,i)=>[result[0][i],result[1][i]]);state.week++;state.checked={};save();renderMenus()}
function getGroceries(){let map=new Map;for(let id of state.slots){const r=recipe(id);for(let raw of r[4]){const [name,amount,unit]=raw.split('|');const key=name+'|'+unit;map.set(key,(map.get(key)||0)+(+amount)*state.people/2)}}return [...map].map(([k,v])=>({key:k,name:k.split('|')[0],unit:k.split('|')[1],qty:v})).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}
function renderGroceries(){let g=getGroceries(),total=g.length,done=g.filter(x=>state.checked[x.key]).length;$('courses').innerHTML=`<div class="panel"><div class="flex space"><h2>Liste de courses</h2><div class="flex no-print"><button class="button outline" id="copy">Copier</button><button class="button outline" onclick="window.print()">Imprimer</button></div></div><p class="muted">Quantités pour ${state.people} personnes · ${done}/${total} articles cochés</p><div class="note small">Produits de base à vérifier : huile d’olive, vinaigre, sel, poivre, herbes, bouillon, paprika.</div><div id="shoppingList">${g.map(x=>`<label class="check"><input type="checkbox" data-key="${escapeHtml(x.key)}" ${state.checked[x.key]?'checked':''}><span class="${state.checked[x.key]?'done':''}">${escapeHtml(x.name)} — <strong>${fmt(x.qty)} ${escapeHtml(x.unit)}</strong></span></label>`).join('')}</div><div class="flex no-print" style="margin-top:16px"><button class="button danger" id="uncheck">Décocher tous les articles</button></div></div>`;document.querySelectorAll('#shoppingList input').forEach(el=>el.onchange=()=>{state.checked[el.dataset.key]=el.checked;save();renderGroceries()});$('uncheck').onclick=()=>{state.checked={};save();renderGroceries()};$('copy').onclick=()=>{let text=g.map(x=>`${state.checked[x.key]?'☑':'☐'} ${x.name} — ${fmt(x.qty)} ${x.unit}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>alert('Liste copiée')).catch(()=>prompt('Copiez la liste :',text));else prompt('Copiez la liste :',text)}}
function recipeHtml(r){return `<details class="recipe" id="rec-${r[0]}"><summary>${escapeHtml(r[1])} <span class="tag">${r[2]} · ${r[3]} min</span></summary>${photoTag(r,"recipe-photo")}<p class="small"><strong>Ingrédients pour 2 personnes :</strong> ${r[4].map(item=>{const [n,q,u]=item.split('|');return escapeHtml(n)+' ('+fmt(+q)+' '+escapeHtml(u)+')'}).join(', ')}.</p><p>${escapeHtml(r[5])}</p><button class="button outline no-print" onclick="toggleFavorite(${r[0]})">${state.favorites.includes(r[0])?'♥ Retirer des favoris':'♡ Ajouter aux favoris'}</button> <button class="button outline no-print" onclick="editRecipe(${r[0]})">✎ Modifier la recette</button> <button class="button danger no-print" onclick="deleteRecipe(${r[0]})">Supprimer</button></details>`}
function renderRecipes(){let filter=$('recipeFilter')?.value||'all';$('recettes').innerHTML=`<div class="panel"><div class="flex space"><h2>Bibliothèque de recettes</h2><select id="recipeFilter"><option value="all">Tous les repas</option><option value="midi" ${filter==='midi'?'selected':''}>Midis</option><option value="soir" ${filter==='soir'?'selected':''}>Soirs</option></select></div><p class="muted small">${R.filter(r=>!state.deleted.includes(r[0])).length} recettes simples pour 2 personnes.</p><div class="flex no-print"><button class="button primary" onclick="editRecipe()">＋ Ajouter une recette</button><a class="idea-link" href="${IDEAS_URL}" target="_blank" rel="noopener noreferrer">💡 Cuisine Actuelle : idées de plats ↗</a></div><div id="recipeEditor"></div>${R.filter(r=>!state.deleted.includes(r[0])&&(filter==='all'||r[2]===filter)).map(recipeHtml).join('')}</div>`;$('recipeFilter').onchange=renderRecipes}
function deleteRecipe(id){const r=recipe(id);if(!r||!confirm('Supprimer « '+r[1]+' » de la bibliothèque ?'))return;if(state.slots.includes(id)){alert('Cette recette est dans votre menu actuel. Remplacez-la d’abord dans l’onglet Menus.');return;}state.deleted.push(id);state.favorites=state.favorites.filter(x=>x!==id);save();renderRecipes();}
function editRecipe(id){
 setTab('recettes');const r=id?recipe(id):null;let target=$('recipeEditor');
 target.innerHTML=`<div class="panel editor" style="margin-top:15px;border:2px solid #24765b"><h3>${r?'Modifier':'Ajouter'} une recette</h3><form id="recipeForm"><label>Nom du plat</label><input name="name" required maxlength="120" value="${escapeHtml(r?r[1]:'')}"><label>Repas</label><select name="type"><option value="midi" ${r?.[2]==='midi'?'selected':''}>Midi</option><option value="soir" ${r?.[2]==='soir'?'selected':''}>Soir</option></select><label>Durée (minutes)</label><input type="number" name="duration" min="1" max="360" value="${r?r[3]:25}" required><label>Ingrédients pour 2 personnes : un ingrédient par ligne, sous la forme nom | quantité | unité</label><textarea name="ingredients" required placeholder="Pommes de terre | 400 | g&#10;Œufs | 2 | unité">${escapeHtml(r?r[4].join('\n'):'')}</textarea><label>Préparation</label><textarea name="steps" required>${escapeHtml(r?r[5]:'')}</textarea><label>Adresse d'une photo (facultatif, https://...)</label><input name="photo" type="url" placeholder="https://..." value="${escapeHtml(r?(state.photos[r[0]]||''):'')}"><p class="small muted">Les photos proposées sont illustratives. Vous pouvez mettre votre propre photo via son adresse Internet.</p><div class="flex"><button class="button primary" type="submit">Enregistrer la recette</button><button type="button" class="button outline" id="cancelEditor">Annuler</button></div></form></div>`;
 $('cancelEditor').onclick=()=>target.innerHTML='';
 $('recipeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let ingredients=String(f.get('ingredients')).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!ingredients.length||ingredients.some(x=>{let a=x.split('|');return a.length!==3||!a[0].trim()||!Number.isFinite(+a[1])||+a[1]<=0||!a[2].trim()})){alert('Chaque ingrédient doit respecter : Nom | quantité | unité (exemple : Riz | 100 | g)');return}
 const rid=r?r[0]:Math.max(1000,...R.map(x=>x[0]))+1;
 const rec=[rid,String(f.get('name')).trim(),String(f.get('type')),Number(f.get('duration')),ingredients.map(x=>x.split('|').map(y=>y.trim()).join('|')),String(f.get('steps')).trim()];
 if(r){let n=R.findIndex(x=>x[0]===rid);R[n]=rec;if(rid>=100){state.custom=state.custom.filter(x=>x[0]!==rid);state.custom.push(rec)}else state.overrides[rid]=rec;}else {R.push(rec);state.custom.push(rec)}
 const photo=String(f.get('photo')||'').trim();if(photo)state.photos[rid]=photo;else delete state.photos[rid];state.checked={};save();renderRecipes();alert('Recette enregistrée !');};
 target.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderIdeas(){$('inspiration').innerHTML=`<div class="panel"><h2>💡 Trouver de nouvelles idées</h2><p>Consultez des idées de recettes sur Cuisine Actuelle, puis utilisez « Ajouter une recette » dans notre bibliothèque pour enregistrer celles que vous aimez avec vos propres quantités.</p><p><a class="idea-link" href="${IDEAS_URL}" target="_blank" rel="noopener noreferrer">Voir les idées sur Cuisine Actuelle ↗</a></p><p class="muted small">Le site s'ouvre dans un nouvel onglet. Les recettes ne sont pas importées automatiquement.</p></div>`}
function renderFavorites(){$('favoris').innerHTML=`<div class="panel"><h2>Mes recettes favorites</h2>${state.favorites.length?state.favorites.map(id=>recipe(id)).filter(r=>r&&!state.deleted.includes(r[0])).map(recipeHtml).join(''):'<p class="muted">Touchez ♡ sur un plat pour l’ajouter à vos favoris.</p>'}</div>`}
function download(name,data){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function renderOptions(){$('options').innerHTML=`<div class="panel"><h2>Réglages et sauvegarde</h2><label>Nombre de personnes : <input id="people" type="number" min="1" max="12" value="${state.people}" style="width:75px"></label><p class="muted small">Les recettes restent détaillées pour 2 personnes. La liste de courses adapte les quantités.</p><div class="flex"><button class="button primary" id="export">⬇ Sauvegarder mes données</button><button class="button outline" id="import">⬆ Restaurer une sauvegarde</button></div><p class="note small">Important : les données restent dans le navigateur de cet appareil. Pour les transférer sur iPhone ou sur un autre PC, exportez le fichier de sauvegarde puis importez-le sur l’autre appareil. Ne supprimez pas les données du navigateur sans sauvegarde.</p></div><div class="panel"><h2>Historique des semaines</h2>${state.history.length?state.history.map((h,i)=>`<div class="row check"><span>Semaine ${h.week+1} · ${escapeHtml(h.date)}</span><button class="button outline" data-history="${i}">Restaurer</button></div>`).join(''):'<p class="muted">L’historique apparaîtra après le premier renouvellement.</p>'}</div><div class="panel"><h2>À propos</h2><p>Fonctionne hors connexion après le premier chargement sur un site sécurisé. Les recettes sont fournies à titre d’organisation culinaire, sans conseil médical individualisé.</p></div>`;$('people').onchange=e=>{state.people=Math.min(12,Math.max(1,+e.target.value||2));state.checked={};save();renderOptions()};$('export').onclick=()=>download('sauvegarde-mes-menus.json',JSON.stringify({...state,version:1,exportedAt:new Date().toISOString()},null,2));$('import').onclick=()=>$('importer').click();document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{let h=state.history[+b.dataset.history];if(confirm('Restaurer cette semaine comme menu actuel ?')){state.slots=[...h.slots];state.checked={};save();setTab('menus')}})}
$('importer').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let v=JSON.parse(await file.text());if(!Array.isArray(v.slots)||v.slots.length!==14||v.slots.some(id=>!recipe(id))||!Array.isArray(v.favorites))throw Error('Format incorrect');if(confirm('Remplacer les données présentes par cette sauvegarde ?')){state={...fresh(),...v};state.custom=Array.isArray(state.custom)?state.custom:[];state.overrides=state.overrides||{};state.photos=state.photos||{};applyRecipeData();state.people=Math.min(12,Math.max(1,+state.people||2));save();setTab('menus');alert('Sauvegarde restaurée')}}catch(err){alert('Impossible de lire cette sauvegarde : '+err.message)}e.target.value=''};
function render(tab){({menus:renderMenus,courses:renderGroceries,recettes:renderRecipes,favoris:renderFavorites,inspiration:renderIdeas,options:renderOptions})[tab]()}render('menus');if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
